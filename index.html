<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Argon Chat — Coming Soon</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    h1 {
      font-size: 3.5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 1rem;
      color: #00ffd5;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.6;
      margin-bottom: 2rem;
    }

    .btn {
      padding: 1rem 2rem;
      background: #00ffd5;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }

    .btn:hover {
      background: #00c9aa;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #1a1a1a;
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    .modal input {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
    }

    .modal button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background-color: #00ffd5;
      border: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .modal button:hover {
      background-color: #00c9aa;
    }
  </style>
</head>
<body>
  <h1>Argon Chat</h1>
  <p>Coming soon</p>
  <div class="btn" onclick="openModal()">Apply to Beta</div>

  <div id="betaModal" class="modal">
    <div class="modal-content">
      <h2>Join the Beta</h2>
      <input type="email" id="emailInput" placeholder="Enter your email" />
      <button onclick="submitEmail()">Submit</button>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('betaModal').style.display = 'flex';
    }

    function submitEmail() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email) {
        alert("Please enter a valid email.");
        return;
      }

      fetch("https://api.argon.gl/api/enroll-beta", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email })
      })
      .then(response => {
        if (response.ok) {
          alert("You're in! We'll contact you soon.");
          document.getElementById('betaModal').style.display = 'none';
        } else {
          alert("Something went wrong. Try again later.");
        }
      })
      .catch(() => {
        alert("Network error. Please try again.");
      });
    }
    window.onclick = function(event) {
      const modal = document.getElementById('betaModal');
      if (event.target === modal) {
        modal.style.display = "none";
      }
    }
  </script>
</body>
</html>
